<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple, différemment</title>
    <meta name="description" content="Apple, différemment le podcast Apple pour tous.">
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #fbfbfd;
            --text-color: #1d1d1f;
            --link-color: #0066cc;
            --border-color: #d2d2d7;
            --section-bg: #ffffff;
            --blue-cta: #0071e3;
            --muted-text: #6e6e73;
            --soft-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
            --hairline: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background-color: #F7EEE6;
            color: var(--text-color);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        body.modal-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: opacity 0.2s ease;
        }

        a:hover {
            opacity: 0.7;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 56px 24px 34px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 52px;
        }

        /* Header */
        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            width: 100%;
            max-width: 760px;
            padding-top: 8px;
        }

        .logo-frame {
            width: 236px;
            height: 236px;
            border-radius: 54px;
            overflow: hidden;
            background-color: #fff;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.16);
            transform: translateZ(0);
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .subtitle {
            font-size: 22px;
            font-weight: 400;
            color: var(--muted-text);
            max-width: 600px;
        }

        .host-link {
            color: var(--link-color);
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .host-link:hover {
            opacity: 1;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* CTA Button */
        .main-cta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--blue-cta);
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            padding: 15px 35px;
            border-radius: 980px;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: none;
            margin-top: 10px;
            box-shadow: 0 12px 24px rgba(0, 113, 227, 0.25);
        }

        .main-cta:hover {
            transform: translateY(-2px);
            background-color: #0077ed;
            box-shadow: 0 16px 30px rgba(0, 113, 227, 0.32);
        }

        .main-cta i {
            width: 20px;
            height: 20px;
        }

        .header-actions {
            display: inline-grid;
            align-items: center;
            gap: 20px;
            min-width: 266px;
            margin-top: 10px;
        }

        .header-actions .main-cta {
            width: 100%;
            margin-top: 0;
            justify-content: center;
        }

        .header-actions .donation {
            width: 100%;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: rgba(255, 255, 255, 0.92);
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 22px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.18);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
        }

        .close-modal {
            background: #f5f5f7;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 980px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #86868b;
            transition: background-color 0.2s ease;
        }

        .close-modal:hover {
            background-color: #e8e8ed;
        }

        /* Podcast Links inside Modal */
        .podcast-links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .podcast-button {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #f5f5f7;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .podcast-button:hover {
            background-color: #e8e8ed;
            transform: translateY(-1px);
            opacity: 1;
        }

        .podcast-button i {
            width: 22px;
            height: 22px;
            color: var(--blue-cta);
        }

        .podcast-button .brand-icon {
            width: 22px;
            height: 22px;
            color: var(--blue-cta);
        }

        /* Profiles - Compact Layout */
        .profiles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            max-width: 760px;
        }

        .profile-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            text-align: left;
            gap: 18px;
            background-color: rgba(255, 255, 255, 0.78);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.84);
            box-shadow: var(--soft-shadow);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .profile-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 55px rgba(0, 0, 0, 0.11);
        }

        .profile-modal-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
        }

        .profile-modal-card .profile-img {
            width: 118px;
            height: 118px;
        }

        .profile-modal-card .profile-name {
            font-size: 30px;
            line-height: 1.1;
        }

        .profile-modal-card .profile-links {
            justify-content: center;
            flex-wrap: wrap;
        }

        .profile-modal-card .profile-button {
            font-size: 14px;
            padding: 10px 16px;
        }

        .profile-img {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            overflow: hidden;
            object-fit: cover;
            flex-shrink: 0;
            border: 3px solid rgba(255, 255, 255, 0.9);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
        }

        .profile-links {
            display: flex;
            gap: 8px;
        }

        .profile-button {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 980px;
            background-color: #f5f5f7;
            font-size: 12px;
            font-weight: 500;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .profile-button:hover {
            background-color: #e8e8ed;
            transform: translateY(-1px);
            opacity: 1;
        }

        .profile-button i {
            width: 12px;
            height: 12px;
        }

        /* Footer / Social */
        footer {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            width: 100%;
            max-width: 760px;
            padding-top: 34px;
            border-top: 1px solid var(--hairline);
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--muted-text);
            padding: 8px 10px;
            border-radius: 980px;
        }

        .social-link i {
            display: block;
            width: 18px;
            height: 18px;
        }

        .instagram-icon {
            position: relative;
            display: block;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            border: 2px solid #6e6e73;
            border-radius: 5px;
        }

        .instagram-icon::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            border: 2px solid #6e6e73;
            border-radius: 50%;
        }

        .instagram-icon::after {
            content: "";
            position: absolute;
            top: 3px;
            right: 3px;
            width: 3px;
            height: 3px;
            background-color: #6e6e73;
            border-radius: 50%;
        }

        .brand-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Donation */
        .donate-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 10px;
            background-color: #FFD60A;
            color: #000000;
            font-size: 18px;
            font-weight: 600;
            padding: 15px 35px;
            border-radius: 980px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 12px 24px rgba(255, 214, 10, 0.28);
        }

        .donate-button:hover {
            transform: translateY(-2px);
            background-color: #ffdf3a;
            box-shadow: 0 16px 30px rgba(255, 214, 10, 0.36);
            opacity: 1;
        }

        .donate-button i {
            width: 20px;
            height: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding-top: 36px;
                gap: 42px;
            }

            .subtitle {
                font-size: 19px;
            }

            .logo-frame {
                width: 190px;
                height: 190px;
                border-radius: 42px;
            }

            .profiles {
                grid-template-columns: 1fr;
            }

            .profile-card {
                padding: 16px;
            }

            .modal-content {
                width: 100%;
                max-width: none;
                height: 80vh;
                position: fixed;
                bottom: 0;
                border-radius: 22px 22px 0 0;
                transform: translateY(100%);
            }

            .modal-overlay.active .modal-content {
                transform: translateY(0);
            }

            .profile-modal-content {
                height: auto;
                min-height: 360px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo-frame">
                <img src="assets/img/pochetteV3.png" alt="Apple, différemment">
            </div>
            <p class="subtitle">
                Le podcast sur Apple avec
                <a href="#audrey" class="host-link" data-profile="audrey">Audrey</a>
                et
                <a href="#mat" class="host-link" data-profile="mat">Mat</a>.
            </p>
            <div class="header-actions">
                <button class="main-cta" id="open-modal">
                    <i data-lucide="podcast"></i>
                    Écouter le podcast
                </button>
                <div class="donation">
                    <a href="https://www.paypal.com/donate/?hosted_button_id=MPGQ5HG2JCM36" class="donate-button">
                        <i data-lucide="heart"></i>
                        Faire un don
                    </a>
                </div>
            </div>
        </header>

        <footer style="margin-top: 20px;">
            <div class="social-links">
                <a href="https://instagram.com/applediff" class="social-link">
                    <span class="instagram-icon" aria-hidden="true"></span>
                    Instagram
                </a>
                <a href="https://www.threads.com/@applediff" class="social-link">
                    <i data-lucide="at-sign"></i>
                    Threads
                </a>
                <a href="https://bsky.app/profile/applediff.bsky.social" class="social-link">
                    <i data-lucide="cloud"></i>
                    Bluesky
                </a>
            </div>
            <p style="margin-top: 30px; color: #86868b; font-size: 11px;">&copy; 2025 Apple, différemment. <br> Présenté
                par Audrey Couleau & Mat.</p>
        </footer>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Écouter sur...</h2>
                <button class="close-modal" id="close-modal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="podcast-links-list">
                <a href="https://itunes.apple.com/fr/podcast/apple-diff%c3%a9remment/id1439580752?mt=2"
                    class="podcast-button">
                    <i data-lucide="podcast"></i>
                    Apple Podcasts
                </a>
                <a href="https://open.spotify.com/show/4kfATCRWOjNCGcJrZI0xVI" class="podcast-button">
                    <i data-lucide="music"></i>
                    Spotify
                </a>
                <a href="https://www.youtube.com/@applediff" class="podcast-button">
                    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M21.6 7.2a3 3 0 0 0-2.1-2.1C17.6 4.6 12 4.6 12 4.6s-5.6 0-7.5.5a3 3 0 0 0-2.1 2.1A31.2 31.2 0 0 0 1.9 12c0 1.6.2 3.2.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 7.5.5 7.5.5s5.6 0 7.5-.5a3 3 0 0 0 2.1-2.1c.3-1.6.5-3.2.5-4.8s-.2-3.2-.5-4.8ZM10 15.3V8.7l5.7 3.3L10 15.3Z"></path>
                    </svg>
                    YouTube
                </a>
                <a href="https://pca.st/goRv" class="podcast-button">
                    <i data-lucide="layout-grid"></i>
                    Pocket Casts
                </a>
                <a href="https://overcast.fm/itunes1439580752/apple-diff-remment" class="podcast-button">
                    <i data-lucide="radio"></i>
                    Overcast
                </a>
                <a href="https://music.amazon.ca/podcasts/64dbba43-ff1b-4713-9922-a168d96761be/apple-diff%C3%A9remment"
                    class="podcast-button">
                    <i data-lucide="music-2"></i>
                    Amazon Music
                </a>
                <a href="https://anchor.fm/s/1db32514/podcast/rss" class="podcast-button">
                    <i data-lucide="rss"></i>
                    Flux RSS
                </a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="profile-modal-overlay">
        <div class="modal-content profile-modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="profile-modal-title">À propos</h2>
                <button class="close-modal" id="close-profile-modal">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="profile-modal-card">
                <img src="assets/img/audrey.jpg" alt="" class="profile-img" id="profile-modal-img">
                <div class="profile-name" id="profile-modal-name"></div>
                <div class="profile-links" id="profile-modal-links"></div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Modal Logic
        const openModalBtn = document.getElementById('open-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const modalOverlay = document.getElementById('modal-overlay');
        const profileLinks = document.querySelectorAll('[data-profile]');
        const profileModalOverlay = document.getElementById('profile-modal-overlay');
        const closeProfileModalBtn = document.getElementById('close-profile-modal');
        const profileModalTitle = document.getElementById('profile-modal-title');
        const profileModalImg = document.getElementById('profile-modal-img');
        const profileModalName = document.getElementById('profile-modal-name');
        const profileModalLinks = document.getElementById('profile-modal-links');
        const body = document.body;

        const profiles = {
            audrey: {
                name: 'Audrey',
                image: 'assets/img/audrey.jpg',
                alt: 'Audrey Couleau',
                links: [
                    { href: 'https://www.appleavecaudrey.fr', icon: 'globe', label: 'Site' },
                    { href: 'https://www.youtube.com/@AudreyCouleauFormationsApple', icon: 'youtube', label: 'YouTube' },
                    { href: 'https://www.instagram.com/appleavecaudrey/', icon: 'instagram', label: 'Instagram' }
                ]
            },
            mat: {
                name: 'Mat',
                image: 'assets/img/mat.jpg',
                alt: 'Mat',
                links: [
                    { href: 'https://profduweb.com', icon: 'globe', label: 'Site' },
                    { href: 'https://www.youtube.com/channel/UCNzUonmxxvG-HIqOC3S7Thw', icon: 'youtube', label: 'YouTube' },
                    { href: 'https://instagram.com/profduweb', icon: 'instagram', label: 'Instagram' }
                ]
            }
        };

        function openModal() {
            modalOverlay.classList.add('active');
            body.classList.add('modal-open');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            if (!profileModalOverlay.classList.contains('active')) {
                body.classList.remove('modal-open');
            }
        }

        function openProfileModal(profileKey) {
            const profile = profiles[profileKey];

            if (!profile) {
                return;
            }

            profileModalTitle.textContent = 'À propos';
            profileModalImg.src = profile.image;
            profileModalImg.alt = profile.alt;
            profileModalName.textContent = profile.name;
            profileModalLinks.innerHTML = profile.links.map((link) => `
                <a href="${link.href}" class="profile-button">
                    ${getLinkIcon(link.icon)}
                    ${link.label}
                </a>
            `).join('');

            lucide.createIcons();
            profileModalOverlay.classList.add('active');
            body.classList.add('modal-open');
        }

        function getLinkIcon(icon) {
            if (icon === 'youtube') {
                return `
                    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M21.6 7.2a3 3 0 0 0-2.1-2.1C17.6 4.6 12 4.6 12 4.6s-5.6 0-7.5.5a3 3 0 0 0-2.1 2.1A31.2 31.2 0 0 0 1.9 12c0 1.6.2 3.2.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 7.5.5 7.5.5s5.6 0 7.5-.5a3 3 0 0 0 2.1-2.1c.3-1.6.5-3.2.5-4.8s-.2-3.2-.5-4.8ZM10 15.3V8.7l5.7 3.3L10 15.3Z"></path>
                    </svg>
                `;
            }

            if (icon === 'instagram') {
                return `
                    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"></rect>
                        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
                        <circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"></circle>
                    </svg>
                `;
            }

            return `<i data-lucide="${icon}"></i>`;
        }

        function closeProfileModal() {
            profileModalOverlay.classList.remove('active');
            if (!modalOverlay.classList.contains('active')) {
                body.classList.remove('modal-open');
            }
        }

        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        closeProfileModalBtn.addEventListener('click', closeProfileModal);

        profileLinks.forEach((link) => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                openProfileModal(link.dataset.profile);
            });
        });

        // Close modal on click outside content
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        profileModalOverlay.addEventListener('click', (e) => {
            if (e.target === profileModalOverlay) {
                closeProfileModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }

            if (e.key === 'Escape' && profileModalOverlay.classList.contains('active')) {
                closeProfileModal();
            }
        });
    </script>
</body>

</html>
